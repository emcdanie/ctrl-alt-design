<script>/* follow the page's theme: ?theme=, or the parent page's data-theme
   when framed (same origin). Observe only when framed, and only write a
   changed value, so the observer never feeds itself. */
(function(){var d=document.documentElement,framed=window.parent!==window;function sync(){var t=new URLSearchParams(location.search).get("theme");if(!t&&framed){try{t=parent.document.documentElement.getAttribute("data-theme")}catch(e){}}if(t&&d.getAttribute("data-theme")!==t)d.setAttribute("data-theme",t)}sync();if(framed){try{new MutationObserver(sync).observe(parent.document.documentElement,{attributes:true,attributeFilter:["data-theme"]})}catch(e){}}})();</script>
<style>
:root{
  --bg:#F1EFE6;--surface:#E9E6DC;--card:#F7F5EE;--ink:#1A1720;--muted:#5E5A55;--line:rgb(26 23 32/.12);
  --iris:#5B45D6;--iris-soft:rgb(91 69 214/.10);--iris-ink:#4A36C4;
  --ok:#2E6B4F;--ok-soft:rgb(46 107 79/.12);--warn:#8A5A12;--warn-soft:rgb(176 120 30/.14);
  --brand:#2F5C86;--brand-drift:#3A6FA0;
  --dur-fast:.15s;--dur-base:.3s;--dur-slow:.6s;--ease-out:cubic-bezier(.22,1,.36,1);
  --shadow-hover:0 8px 24px rgb(26 23 32/.08);
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#110F0D;--surface:#1B1916;--card:#1F1D1A;--ink:#F3EFE8;--muted:#A8A29A;--line:rgb(243 239 232/.12);
  --iris:#A99BF5;--iris-soft:rgb(169 155 245/.14);--iris-ink:#C3B8FA;--ok:#8FD1AE;--ok-soft:rgb(143 209 174/.14);--warn:#E8C27A;--warn-soft:rgb(232 194 122/.14);
  --brand:#6F9CC8;--brand-drift:#9BC0E3;--shadow-hover:0 8px 24px rgb(0 0 0/.45)}}
:root[data-theme=dark]{
  --bg:#110F0D;--surface:#1B1916;--card:#1F1D1A;--ink:#F3EFE8;--muted:#A8A29A;--line:rgb(243 239 232/.12);
  --iris:#A99BF5;--iris-soft:rgb(169 155 245/.14);--iris-ink:#C3B8FA;--ok:#8FD1AE;--ok-soft:rgb(143 209 174/.14);--warn:#E8C27A;--warn-soft:rgb(232 194 122/.14);
  --brand:#6F9CC8;--brand-drift:#9BC0E3;--shadow-hover:0 8px 24px rgb(0 0 0/.45)}
*{box-sizing:border-box}
html{interpolate-size:allow-keywords}
body{margin:0;background:var(--bg);color:var(--ink);font:400 18px/1.6 Geist,system-ui,sans-serif}
h1,h2,h3{text-wrap:balance;margin:0}p{text-wrap:pretty;margin:0}
.wrap{max-width:74rem;margin:0 auto;padding:0 clamp(1.5rem,4vw,3rem)}
.code{font:400 14px/1.45 'Geist Mono',monospace;color:var(--muted)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:16px 0;border-bottom:1px solid var(--line)}
.btn{font:500 16px Geist,sans-serif;color:var(--iris);background:none;border:1px solid var(--iris);border-radius:999px;padding:8px 18px;cursor:pointer;min-height:44px}
.btn:hover{background:var(--iris-soft)}
:focus-visible{outline:2px solid var(--iris);outline-offset:2px}

/* hero */
.hero{padding:3.2rem 0 2.5rem}
.hero h1{font-size:clamp(2.2rem,5vw,4rem);line-height:1.02;letter-spacing:-.03em;font-weight:800;margin:.75rem 0 1.5rem;max-width:18ch}
.hero h1 em{font-style:normal;color:var(--iris)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(10rem,1fr));gap:1rem 2rem;border-top:1px solid var(--line);padding-top:1.25rem}
.facts dt{font:400 14px 'Geist Mono',monospace;color:var(--muted)}.facts dd{margin:.2rem 0 0;font-weight:500}
.nda{margin-top:1.5rem;font-size:16px;color:var(--muted);max-width:44rem}



.grave{display:grid;grid-template-columns:repeat(auto-fill,minmax(7rem,1fr));gap:.6rem}
.gb{font:inherit;font-size:15px;padding:.5rem .8rem;color:#fff;background:var(--brand);border:0;pointer-events:none}
.chain{display:grid;gap:.6rem}
.chain .row{display:grid;grid-template-columns:7rem 1fr;gap:1rem;align-items:center;background:var(--bg);border-radius:12px;padding:.7rem .9rem}
.chips{display:flex;flex-wrap:wrap;gap:.4rem}
.chip{font-size:14px;padding:.25rem .7rem;border-radius:999px;border:1px solid var(--line);background:var(--bg)}
.arrow{justify-self:center;color:var(--muted);font-size:14px}
.seg{display:inline-flex;background:var(--surface);border-radius:999px;padding:4px;gap:2px}
.seg button{font:500 15px Geist,sans-serif;border:0;background:none;color:var(--ink);border-radius:999px;padding:.4rem 1rem;min-height:36px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--card);box-shadow:0 1px 2px rgb(0 0 0/.1);color:var(--iris-ink)}
.status{display:inline-flex;align-items:center;gap:.4rem;font-size:15px;font-weight:500;border-radius:999px;padding:.3rem .8rem}
.status.ok{background:var(--ok-soft);color:var(--ok)}.status.bad{background:var(--warn-soft);color:var(--warn)}
.pipe{display:grid;gap:.75rem}
@container (min-width:420px){.pipe{grid-template-columns:1fr auto 1fr auto 1fr;align-items:start}.pipe > .to{rotate:0deg}}
.tier{background:var(--bg);border-radius:12px;padding:.8rem;display:grid;gap:.4rem;align-content:start}
.tier .t{font-size:14px;font-weight:600}
.tok{display:flex;align-items:center;gap:.5rem;font:500 14px 'Geist Mono',monospace}
.sw{width:22px;height:22px;border-radius:6px;background:var(--brand);border:1px solid var(--line);flex:none;transition:background var(--dur-base) var(--ease-out)}
.to{align-self:center;justify-self:center;color:var(--muted);font:14px 'Geist Mono',monospace;rotate:90deg}
@media(min-width:1100px){.pipe > .to{rotate:0deg}}
.book{justify-self:start;font:600 15px Geist,sans-serif;color:#fff;background:var(--brand);border:0;border-radius:10px;padding:.55rem 1rem;transition:background var(--dur-base) var(--ease-out)}
.drifted .cs .sw,.drifted .book{background:var(--brand-drift)}
.diff{display:none;font-size:14px;color:var(--warn);font-weight:500}.drifted .diff{display:block}
pre{margin:0;background:var(--bg);border-radius:12px;padding:1rem;overflow-x:auto;font:400 14px/1.7 'Geist Mono',monospace}
pre b{color:var(--iris-ink);font-weight:500}
table{width:100%;border-collapse:collapse;font-size:16px}
th,td{text-align:left;padding:.65rem .5rem;border-bottom:1px solid var(--line)}
th{font:400 14px 'Geist Mono',monospace;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:.35rem;font-size:14px;font-weight:500;padding:.15rem .6rem;border-radius:999px;border:1px solid var(--line)}

/* Southleft pattern: alternating split sections, one idea each */
.sec{display:grid;gap:1.5rem;padding:3rem 0;border-top:1px solid var(--line);align-items:center}
@media(min-width:900px){.sec{grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:3.5rem}.sec.flip .txt{order:2}}
.txt .code{margin-bottom:.5rem}
.txt h2{font-size:clamp(1.5rem,2.4vw,2rem);line-height:1.15;letter-spacing:-.02em;font-weight:700;margin-bottom:.9rem}
.txt p{font-size:17px}.txt p+p{margin-top:.8rem}.key{font-weight:600}
/* linked phrase: same look as the site's Terms (dotted = interactive) */
.spot{font:inherit;color:inherit;background:none;border:0;padding:0 .1em;border-radius:4px;border-bottom:1.5px dotted var(--iris);cursor:pointer;transition:background var(--dur-fast) var(--ease-out),color var(--dur-fast) var(--ease-out)}
.spot sup{font:500 12px 'Geist Mono',monospace;color:var(--iris);margin-left:.1em}
.spot.on,.spot:hover{background:var(--iris-soft);color:var(--iris-ink)}
.term{font:inherit;color:inherit;background:none;border:0;padding:0;border-bottom:1.5px dotted var(--iris);cursor:pointer}
.tip{padding:.7rem 1rem;border-radius:12px;background:var(--surface);font-size:16px;margin-top:.6rem}
.tip[hidden]{display:none}
/* figure in a quiet frame, capped height */
figure{margin:0}
.frame{background:var(--card);border:1px solid var(--line);border-radius:1rem;overflow:hidden}
.frame-bar{display:flex;gap:6px;align-items:center;padding:.6rem .9rem;border-bottom:1px solid var(--line)}
.frame-bar i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.frame-bar span{margin-left:.5rem}
.ex{padding:1.1rem;display:grid;gap:.9rem;container-type:inline-size;max-height:26rem;overflow:auto}
figcaption{font-size:15px;color:var(--muted);margin-top:.6rem}
/* highlight ring on the example */
[data-t]{transition:outline-color var(--dur-fast) var(--ease-out),box-shadow var(--dur-fast) var(--ease-out);outline:3px solid transparent;outline-offset:3px;border-radius:10px}
[data-t].hl{outline-color:var(--iris);box-shadow:0 0 0 8px var(--iris-soft)}
[data-t].dim{opacity:.35}
.ex.focus [data-t]:not(.hl){opacity:.35;transition:opacity var(--dur-fast) var(--ease-out)}
@media (prefers-reduced-motion:reduce){[data-t]{transition:none}}
.close{padding:3rem 0;border-top:1px solid var(--line);display:grid;gap:1.5rem}
@media(min-width:900px){.close{grid-template-columns:5fr 6fr;gap:3.5rem}}
.close h2{font-size:clamp(1.8rem,3vw,2.6rem);line-height:1.08;letter-spacing:-.02em;font-weight:800}
.note{margin:2rem 0 3rem;padding:1rem 1.25rem;border:1px dashed var(--line);border-radius:1rem;font-size:16px;color:var(--muted)}
.note b{color:var(--ink)}

.cs2{padding:3rem 0;border-top:1px solid var(--line);display:grid;gap:1.25rem}
.cs2 h2{font-size:clamp(1.5rem,2.4vw,2rem);letter-spacing:-.02em;font-weight:700;margin:.35rem 0 .4rem}
.cs2 .lead{font-size:17px;max-width:40rem}
.cs2 .grid{display:grid;gap:1.5rem}
@media(min-width:1000px){.cs2 .grid{grid-template-columns:minmax(0,8fr) minmax(0,4fr);align-items:start}}
.stage{background:var(--card);border:1px solid var(--line);border-radius:1rem;padding:1rem;display:grid;gap:.8rem}
.stage-top{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap}
.view{position:relative;border-radius:10px;overflow:hidden;background:#fff;aspect-ratio:1320/590;container-type:inline-size}
.view img{display:block;width:100%;height:100%}
.layer[hidden]{display:none}
.zone{position:absolute;border-radius:8px;outline:2px solid transparent;outline-offset:3px;transition:outline-color var(--dur-fast) var(--ease-out),background var(--dur-fast) var(--ease-out);pointer-events:none}
.zone.hl{outline-color:var(--iris);background:rgb(91 69 214/.06)}
.pin{position:absolute;translate:-50% -50%;width:24px;height:24px;border-radius:50%;background:var(--iris);color:#fff;font:600 13px Geist,sans-serif;display:grid;place-items:center;border:2px solid #fff;box-shadow:0 2px 6px rgb(0 0 0/.2);pointer-events:none;transition:scale var(--dur-fast) var(--ease-out)}
.pin.hl{scale:1.2}
@media (prefers-reduced-motion:reduce){.zone,.pin{transition:none}}
.notes{list-style:none;margin:0;padding:0;display:grid;gap:.2rem}
.note{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:auto 1fr;gap:.7rem;padding:.55rem .7rem;border-radius:10px;width:100%}
.note .n{width:22px;height:22px;border-radius:50%;background:var(--iris);color:var(--card);font:600 12px Geist,sans-serif;display:grid;place-items:center;margin-top:.15rem}
.note b{display:block;font-size:16px;font-weight:600;line-height:1.35}
.note .d{display:block;font-size:15px;color:var(--muted);line-height:1.45;margin-top:.1rem}
.note:hover,.note.on{background:var(--iris-soft)}
.note:focus-visible{outline:2px solid var(--iris)}
/* the "after" screen, built live */
.after{position:absolute;inset:0;background:#fff;font-family:Geist,sans-serif;color:#1A1720;padding:3.2cqw 3.6cqw;display:grid;align-content:start;gap:2.2cqw}
.after h3{font-size:3.2cqw;font-weight:600;letter-spacing:-.02em;margin:0}
.after .row{display:flex;gap:1.2cqw;align-items:center;flex-wrap:wrap}
.after .pillset{display:inline-flex;gap:.4cqw;background:#F1EFE6;border-radius:999px;padding:.45cqw}
.after .pillset span{font-size:1.45cqw;padding:.7cqw 1.6cqw;border-radius:999px;color:#5E5A55}
.after .pillset span.sel{background:rgb(91 69 214/.12);color:#4A36C4;font-weight:600}
.after .fields{display:grid;grid-template-columns:2.2fr 1fr 1fr 1.2fr auto;gap:1cqw;align-items:stretch}
.after .f{border:1px solid rgb(26 23 32/.14);border-radius:1cqw;padding:1.1cqw 1.3cqw;font-size:1.45cqw;color:#5E5A55;display:flex;align-items:center;gap:.8cqw;white-space:nowrap}
.after .f i{font-style:normal;color:#8A857E}
.after .go{background:#5B45D6;color:#fff;border-radius:1cqw;padding:1.1cqw 2.4cqw;font-size:1.5cqw;font-weight:600;display:flex;align-items:center;gap:.6cqw}
.after .next{display:grid;grid-template-columns:auto 1fr auto;gap:1.4cqw;align-items:center;border:1px solid rgb(26 23 32/.1);border-radius:1.2cqw;padding:1.2cqw;margin-top:1cqw}.after .thumb{width:8cqw;aspect-ratio:4/3;border-radius:.8cqw;background:linear-gradient(135deg,#d9d2c3,#b9b0a0)}.after .k{font-size:1.2cqw;color:#5E5A55}.after .t{font-size:1.6cqw;font-weight:600}.after .st{font-size:1.2cqw;border:1px solid rgb(46 107 79/.35);color:#2E6B4F;border-radius:999px;padding:.3cqw 1cqw}
.after .hint{font-size:1.25cqw;color:#5E5A55}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(11rem,1fr));gap:1rem;margin-top:.5rem}
.st{background:var(--card);border:1px solid var(--line);border-radius:1rem;padding:1.1rem;display:grid;gap:.3rem}
.st .v{font-size:clamp(2rem,3.4vw,2.8rem);font-weight:800;letter-spacing:-.03em;line-height:1}
.st .l{font-size:15px;color:var(--muted)}
.src{margin-top:.6rem}
.shiplist{list-style:none;margin:0;padding:0;display:grid;border-top:1px solid var(--line)}
.shiplist li{display:grid;grid-template-columns:12rem 1fr auto;gap:1rem;align-items:center;padding:.8rem 0;border-bottom:1px solid var(--line)}
@media(max-width:700px){.shiplist li{grid-template-columns:1fr auto}.shiplist .sd{grid-column:1/-1;grid-row:2}}
.sn{font-weight:600}.sd{color:var(--muted);font-size:16px}
.pill.ok{color:var(--ok);border-color:rgb(46 107 79/.3)}.pill.wip{color:var(--warn);border-color:rgb(176 120 30/.35)}
.hero h1{max-width:20ch}
.facts dd{font-size:16px}
.view img{object-fit:cover}
.gap{border:1px dashed var(--line);border-radius:1rem;padding:1.5rem;color:var(--muted);font-size:16px}
.series{display:grid;grid-template-columns:repeat(auto-fit,minmax(16rem,1fr));gap:1rem}.sc{display:flex;flex-direction:column;gap:.5rem;padding:1.25rem;border:1px solid var(--line);border-radius:16px;color:inherit;text-decoration:none;transition:transform var(--dur-base,.3s) var(--ease-out,ease),box-shadow var(--dur-base,.3s),border-color .15s}.sc h3{font-size:20px;line-height:1.25;letter-spacing:-.01em}.sc p{font-size:16px;color:var(--muted)}.sc .lg{font-size:14px;margin-top:auto}.sc .pill{align-self:flex-start}a.sc:hover{transform:translateY(-2px);box-shadow:var(--shadow-hover,0 8px 24px rgb(0 0 0/.08));border-color:var(--iris)}a.sc:focus-visible{outline:2px solid var(--iris);outline-offset:2px}.lead a{color:var(--iris)}.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(18rem,1fr));gap:1rem}.aud{padding:1.25rem;border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;gap:.5rem}.aud h3{font-size:20px;letter-spacing:-.01em}.aud ul{margin:0;padding-left:1.1rem;color:var(--muted);font-size:16px;display:grid;gap:.4rem}</style>
<style>
/* embedded in the site's ExampleFrame: the frame is the page's, so the
   mock's own page chrome goes; the product screen keeps its style */
html,body{background:transparent}
.wrap{max-width:none;padding:0}
.cs{padding-bottom:0}
.stage,.kstage{background:none;border:0;padding:0;min-width:0}
/* the control row wraps at phone width instead of pushing the frame wide */
.stage-top{flex-wrap:wrap;row-gap:8px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="wrap">
<div class="grid"><div class="stage"><div class="stage-top"><div class="seg" role="group" aria-label="Version"><button aria-pressed="true" data-v="before">Before</button><button aria-pressed="false" data-v="after">After</button></div><span class="code vcap" data-b="Before · legacy search results" data-a="After · shipped search, flights">Before · legacy search results</span></div>
 <div class="view" style="aspect-ratio:657/563;width:min(100%,calc(60vh * 657 / 563));margin-inline:auto"><div class="layer" data-layer="before" style="position:absolute;inset:0"><img alt="Before" src="/images/case-studies/travel/booking-search-4.webp"><span class="zone" data-t="summary" style="left:0.15%;top:4.97%;width:99.85%;height:3.91%"></span><span class="pin" data-t="summary" style="left:100.00%;top:4.97%">1</span><span class="zone" data-t="filters" style="left:11.57%;top:24.51%;width:19.63%;height:75.49%"></span><span class="pin" data-t="filters" style="left:31.20%;top:24.51%">2</span><span class="zone" data-t="results" style="left:33.49%;top:14.21%;width:62.40%;height:4.97%"></span><span class="pin" data-t="results" style="left:95.89%;top:14.21%">3</span><span class="zone" data-t="policy" style="left:33.49%;top:36.94%;width:62.40%;height:3.91%"></span><span class="pin" data-t="policy" style="left:95.89%;top:36.94%">4</span><span class="zone" data-t="policy" style="left:33.49%;top:59.15%;width:62.40%;height:3.91%"></span></div>
 <div class="layer" data-layer="after" style="position:absolute;inset:0" hidden=""><img alt="After: shipped flight results with a pinned search summary, Filter and Sort buttons, and flight cards" src="/images/case-studies/travel/booking-search-5.webp"><span class="zone" data-t="summary" style="left:4.58%;top:7.21%;width:90.83%;height:6.81%"></span><span class="pin" data-t="summary" style="left:95.4%;top:7.21%">1</span><span class="zone" data-t="filters" style="left:78.5%;top:19.9%;width:15.4%;height:3.1%"></span><span class="zone" data-t="filters" style="left:6.1%;top:19.9%;width:9.3%;height:1.9%"></span><span class="pin" data-t="filters" style="left:93.9%;top:19.9%">2</span><span class="zone" data-t="results" style="left:6.25%;top:31.0%;width:87.6%;height:68.9%"></span><span class="pin" data-t="results" style="left:6.25%;top:31.0%">3</span><span class="zone" data-t="policy" style="left:64.4%;top:26.9%;width:29.4%;height:2.0%"></span><span class="zone" data-t="policy" style="left:77.4%;top:41.7%;width:7.2%;height:1.9%"></span><span class="pin" data-t="policy" style="left:64.4%;top:26.9%">4</span></div></div></div>
 <ol class="notes"><li><button class="spot note" data-k="summary"><span class="n">1</span><span><b>Keep the search in view</b><span class="d">Before: changing a date restarted the whole search, and people dropped off. After: the search stays pinned at the top and changes without starting over.</span></span></button></li><li><button class="spot note" data-k="filters"><span class="n">2</span><span><b>One filter button, not a wall</b><span class="d">Before: a long sidebar of risk levels, presets and sliders. After: Filter and Sort, a count of what's active, and the chips in a drawer.</span></span></button></li><li><button class="spot note" data-k="results"><span class="n">3</span><span><b>Scan, don't read</b><span class="d">Before: a text list. After: every card puts time, route, stops and price in the same place.</span></span></button></li><li><button class="spot note" data-k="policy"><span class="n">4</span><span><b>Say the rule once</b><span class="d">Before: the same policy warning on every result. After: the limit once above the list, and a small badge on each fare.</span></span></button></li></ol></div>
</div>
<button id="theme" hidden aria-hidden="true" tabindex="-1"></button>
<script>

const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];let pinned=null;
const sc=e=>e.closest('.cs2');
const clear=s=>{$$('.hl',s).forEach(e=>e.classList.remove('hl'));$$('.note.on',s).forEach(e=>e.classList.remove('on'))};
const light=n=>{const s=sc(n);clear(s);n.classList.add('on');$$('[data-t="'+n.dataset.k+'"]',s).forEach(e=>e.classList.add('hl'))};
$$('.note[data-k]').forEach(n=>{n.onmouseenter=()=>{if(!pinned)light(n)};n.onmouseleave=()=>{if(!pinned)clear(sc(n))};n.onfocus=()=>{if(!pinned)light(n)};n.onblur=()=>{if(!pinned)clear(sc(n))};

document.addEventListener('keydown',e=>{if(e.key==='Escape'&&pinned){clear(sc(pinned));pinned=null}});
