<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flight results, shipped and refined (recreated)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>/* follow the page's theme: ?theme=, or the parent page's data-theme
   when framed (same origin). Observe only when framed, and only write a
   changed value, so the observer never feeds itself. */
(function(){var d=document.documentElement,framed=window.parent!==window;function sync(){var t=new URLSearchParams(location.search).get("theme");if(!t&&framed){try{t=parent.document.documentElement.getAttribute("data-theme")}catch(e){}}if(t&&d.getAttribute("data-theme")!==t)d.setAttribute("data-theme",t)}sync();if(framed){try{new MutationObserver(sync).observe(parent.document.documentElement,{attributes:true,attributeFilter:["data-theme"]})}catch(e){}}})();</script>
<style>
:root{
  --bg:#F1EFE6;--surface:#E9E6DC;--card:#F7F5EE;--ink:#1A1720;--muted:#5E5A55;--line:rgb(26 23 32/.12);
  --iris:#5B45D6;--iris-soft:rgb(91 69 214/.10);--iris-ink:#4A36C4;
  --ok:#2E6B4F;--ok-soft:rgb(46 107 79/.12);--warn:#8A5A12;--warn-soft:rgb(176 120 30/.14);
  --dur-fast:.15s;--dur-base:.3s;--dur-slow:.6s;--ease-out:cubic-bezier(.22,1,.36,1);
  --shadow-hover:0 10px 28px rgb(26 23 32/.10);
  --app-bg:#FAFAF7;--app-card:#fff;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#110F0D;--surface:#1B1916;--card:#1F1D1A;--ink:#F3EFE8;--muted:#A8A29A;--line:rgb(243 239 232/.12);
  --iris:#A99BF5;--iris-soft:rgb(169 155 245/.14);--iris-ink:#C3B8FA;--ok:#8FD1AE;--ok-soft:rgb(143 209 174/.14);--warn:#E8C27A;--warn-soft:rgb(232 194 122/.14);
  --shadow-hover:0 10px 28px rgb(0 0 0/.45);--app-bg:#171512;--app-card:#211F1B}}
:root[data-theme=dark]{
  --bg:#110F0D;--surface:#1B1916;--card:#1F1D1A;--ink:#F3EFE8;--muted:#A8A29A;--line:rgb(243 239 232/.12);
  --iris:#A99BF5;--iris-soft:rgb(169 155 245/.14);--iris-ink:#C3B8FA;--ok:#8FD1AE;--ok-soft:rgb(143 209 174/.14);--warn:#E8C27A;--warn-soft:rgb(232 194 122/.14);
  --shadow-hover:0 10px 28px rgb(0 0 0/.45);--app-bg:#171512;--app-card:#211F1B}
*{box-sizing:border-box}
html{interpolate-size:allow-keywords}
body{margin:0;background:var(--bg);color:var(--ink);font:400 18px/1.6 Geist,system-ui,sans-serif}
h1,h2,h3{text-wrap:balance;margin:0}p{text-wrap:pretty;margin:0}
button{font:inherit;color:inherit}
.wrap{max-width:78rem;margin:0 auto;padding:0 clamp(1rem,4vw,3rem)}
.code{font:400 14px/1.45 'Geist Mono',monospace;color:var(--muted)}
:focus-visible{outline:2px solid var(--iris);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:16px 0;border-bottom:1px solid var(--line)}
.top a{color:inherit}
.hero{padding:3rem 0 2rem;max-width:48rem}
.hero h1{font-size:clamp(2rem,4.6vw,3.4rem);line-height:1.04;letter-spacing:-.03em;font-weight:800;margin:.6rem 0 1rem}
.hero p{color:var(--muted);font-size:19px}

/* stage */
.cs{display:grid;grid-template-columns:minmax(0,1fr) 20rem;gap:2rem;align-items:start;padding-bottom:4rem}
@media (max-width:980px){.cs{grid-template-columns:1fr}}
.stage{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px}
.stage-top{display:flex;flex-wrap:wrap;gap:.6rem;justify-content:space-between;align-items:center;padding:4px 4px 12px}
.seg{display:inline-flex;background:var(--surface);border-radius:999px;padding:3px}
.seg button{all:unset;cursor:pointer;font:500 15px Geist,sans-serif;padding:6px 14px;border-radius:999px;color:var(--muted);min-height:32px;display:flex;align-items:center}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0/.12)}
.seg button:focus-visible{outline:2px solid var(--iris)}
.frame{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--app-bg);margin-inline:auto;transition:max-width var(--dur-slow) var(--ease-out)}
.frame.mobile{max-width:390px}
.fbar{display:flex;align-items:center;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--card)}
.fbar i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.fbar .code{margin-left:8px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shot{display:block;width:100%;height:40rem;object-fit:cover;object-position:top}
.notes{list-style:none;margin:0;padding:0;display:grid;gap:.2rem}
.note{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:auto 1fr;gap:.7rem;padding:.6rem .75rem;border-radius:10px;width:100%}
.note .n{width:22px;height:22px;border-radius:50%;background:var(--iris);color:var(--card);font:600 12px Geist,sans-serif;display:grid;place-items:center;margin-top:.15rem}
.note b{display:block;font-size:16px;font-weight:600;line-height:1.35}
.note .d{display:block;font-size:15px;color:var(--muted);line-height:1.45;margin-top:.1rem}
.note:hover,.note.on{background:var(--iris-soft)}
.note:focus-visible{outline:2px solid var(--iris)}
.side h2{font-size:22px;letter-spacing:-.01em;margin:.2rem 0 .5rem}
.side p.lead{color:var(--muted);font-size:16px;margin-bottom:1rem}

/* ================= product: glass, quiet luxury ================= */
[hidden]:not(.drawer){display:none!important}
.vp{--ink:#1D1D1F;--mut:#6E6E73;--faint:#A1A1A6;--hair:rgb(0 0 0/.07);--brand:#3E6FD8;--brand-2:#5B8CF0;--brand-soft:#EDF2FD;
  --ok:#1E7A4C;--ok-soft:#E7F5EE;--bad:#C0392B;--bad-soft:#FCEDEA;--warn:#8C5A00;--warn-soft:#FFF4DB;
  --glass:rgb(255 255 255/.66);--glass-hi:rgb(255 255 255/.86);--rim:rgb(255 255 255/.75);
  --sh-1:0 1px 1px rgb(16 24 64/.04),0 8px 24px rgb(16 24 64/.06);--sh-2:0 2px 4px rgb(16 24 64/.05),0 22px 48px rgb(16 24 64/.13);
  --r-lg:24px;--r-md:16px;--r-sm:12px;--e:cubic-bezier(.22,1,.36,1);
  position:relative;overflow:hidden;container-type:inline-size;color:var(--ink);font:400 15px/1.45 Figtree,system-ui,sans-serif;-webkit-font-smoothing:antialiased;color-scheme:light}
.vp *{box-sizing:border-box}
.vp button{font:inherit;color:inherit}
.vp :focus{outline:none}
.vp :focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.app{height:42rem;overflow:auto;scroll-behavior:smooth;scrollbar-width:thin;
  background:radial-gradient(52rem 26rem at 88% -8%,#DCE6FB 0,transparent 62%),radial-gradient(40rem 26rem at -12% 38%,#EFE8FA 0,transparent 60%),radial-gradient(30rem 20rem at 60% 110%,#E3F0F7 0,transparent 60%),#F4F4F7}
.ic{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* nav */
.nav{position:relative;z-index:22;display:flex;align-items:center;gap:4px;padding:10px 20px;background:var(--glass);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border-bottom:1px solid var(--hair)}
.brandm{display:flex;align-items:center;gap:8px;font-weight:600;letter-spacing:-.01em;margin-right:14px}
.orb{width:22px;height:22px;border-radius:50%;background:conic-gradient(from 200deg,#3E6FD8,#8E7CF0,#62B6E8,#3E6FD8);box-shadow:inset 0 0 0 3px rgb(255 255 255/.55)}
.nl{all:unset;cursor:pointer;padding:6px 12px;border-radius:10px;color:var(--mut);font-size:14px;transition:background .15s,color .15s}
.nl:hover{color:var(--ink);background:rgb(0 0 0/.04)}
.nl[aria-current]{color:var(--ink);background:rgb(0 0 0/.055);font-weight:500}
.nav .sp{flex:1}
.icb{all:unset;cursor:pointer;position:relative;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--mut)}
.icb:hover{background:rgb(0 0 0/.05);color:var(--ink)}
.icb .dot{position:absolute;top:8px;right:9px;width:7px;height:7px;border-radius:50%;background:var(--brand);box-shadow:0 0 0 2px #fff}
.av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#C9D6F7,#E6D9F7);display:grid;place-items:center;font-size:12px;font-weight:600;color:#3B3B55;margin-left:6px}

/* search bar */
.sbw{position:sticky;top:0;z-index:20;padding:16px 20px 14px;background:linear-gradient(#F4F4F7 50%,rgb(244 244 247/0))}
.sbar{position:relative;display:flex;align-items:stretch;padding:6px;border-radius:var(--r-lg);background:var(--glass-hi);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);box-shadow:var(--sh-1),inset 0 0 0 1px var(--rim);transition:box-shadow .3s var(--e)}
.app.scrolled .sbar{box-shadow:var(--sh-2),inset 0 0 0 1px var(--rim)}
.sf{all:unset;cursor:pointer;flex:1 1 0;min-width:0;padding:9px 16px;border-radius:18px;position:relative;transition:background .15s,box-shadow .2s,padding .3s var(--e)}
.sf[data-f=from],.sf[data-f=to]{flex-grow:1.3}
.sf+.sf::before{content:"";position:absolute;left:0;top:26%;bottom:26%;width:1px;background:var(--hair);transition:opacity .15s}
.sf:hover{background:rgb(255 255 255/.9)}
.sf:hover::before,.sf:hover+.sf::before,.sf[aria-expanded=true]::before,.sf[aria-expanded=true]+.sf::before{opacity:0}
.sf[aria-expanded=true]{background:#fff;box-shadow:0 6px 18px rgb(16 24 64/.09)}
.sf .l{display:block;font-size:12px;color:var(--mut);letter-spacing:.01em;overflow:hidden;transition:opacity .25s,height .3s var(--e);height:auto}
.sf .v{display:block;font-size:16px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sf .v small{font-size:12px;color:var(--faint);letter-spacing:.06em;margin-left:5px}
.app.scrolled .sf{padding:6px 16px}
.app.scrolled .sf .l{opacity:0;height:0}
.swap{all:unset;cursor:pointer;position:absolute;z-index:2;top:50%;width:28px;height:28px;margin:-14px 0 0 -14px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgb(16 24 64/.12);display:grid;place-items:center;color:var(--mut);transition:transform .35s var(--e),color .15s}
.swap:hover{color:var(--brand);transform:rotate(180deg)}
.toast{position:absolute;left:50%;bottom:-6px;transform:translate(-50%,100%);font-size:12px;color:var(--ok);background:#fff;padding:4px 10px;border-radius:999px;box-shadow:var(--sh-1);opacity:0;transition:opacity .25s,transform .35s var(--e);pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,calc(100% + 4px))}

/* popovers */
.pop{position:absolute;z-index:30;top:calc(100% + 8px);width:19rem;padding:10px;border-radius:20px;background:rgb(255 255 255/.9);backdrop-filter:blur(28px) saturate(180%);-webkit-backdrop-filter:blur(28px) saturate(180%);box-shadow:var(--sh-2),inset 0 0 0 1px var(--rim);transform-origin:top left;transition:opacity .15s,transform .3s var(--e)}
@starting-style{.pop{opacity:0;transform:translateY(-6px) scale(.98)}}
.field{display:flex;align-items:center;gap:8px;padding:0 12px;border-radius:12px;background:#fff;box-shadow:inset 0 0 0 1px var(--hair);transition:box-shadow .15s}
.field:focus-within{box-shadow:inset 0 0 0 1.5px var(--brand),0 0 0 4px var(--brand-soft)}
.field input{all:unset;flex:1;padding:11px 0;font-size:15px}
.field input::placeholder{color:var(--faint)}
.ac{list-style:none;margin:8px 0 0;padding:0;max-height:15.5rem;overflow:auto}
.ac li{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;cursor:pointer}
.ac li[aria-selected=true]{background:var(--brand-soft)}
.ac .pin{width:30px;height:30px;border-radius:10px;background:#F1F2F6;display:grid;place-items:center;color:var(--mut);flex:none}
.ac li[aria-selected=true] .pin{background:#fff;color:var(--brand)}
.ac .nm{flex:1;min-width:0}.ac .nm b{font-weight:500;display:block}.ac .nm span{font-size:12px;color:var(--mut)}
.ac .code3{font-size:12px;letter-spacing:.08em;color:var(--mut);font-weight:500}
.ac mark{background:none;color:var(--brand);font-weight:600}
.ac .none{cursor:default;color:var(--mut);font-size:14px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day{all:unset;cursor:pointer;text-align:center;padding:9px 0 8px;border-radius:14px;font-size:11px;color:var(--mut);transition:background .15s}
.day b{display:block;font-size:17px;font-weight:500;color:var(--ink);margin:1px 0}
.day .p{font-size:11px}.day .p.low{color:var(--ok);font-weight:600}
.day:hover{background:rgb(0 0 0/.04)}
.day[aria-pressed=true]{background:var(--brand);color:rgb(255 255 255/.8);box-shadow:0 6px 16px rgb(62 111 216/.35)}
.day[aria-pressed=true] b,.day[aria-pressed=true] .p{color:#fff}
.hint{font-size:12px;color:var(--mut);margin:8px 4px 2px}
.seg2{display:flex;gap:2px;padding:3px;border-radius:12px;background:#EEEEF2}
.seg2 button{all:unset;cursor:pointer;flex:1;text-align:center;padding:7px 8px;border-radius:10px;font-size:14px;color:var(--mut);transition:background .2s,color .2s,box-shadow .2s}
.seg2 button[aria-pressed=true]{background:#fff;color:var(--ink);font-weight:500;box-shadow:0 1px 4px rgb(16 24 64/.12)}
.prow{display:flex;justify-content:space-between;align-items:center;padding:12px 4px 4px}
.prow span{font-size:14px}.prow small{display:block;font-size:12px;color:var(--mut)}
.step{display:flex;align-items:center;gap:12px}
.step button{all:unset;cursor:pointer;width:32px;height:32px;border-radius:50%;box-shadow:inset 0 0 0 1px var(--hair);display:grid;place-items:center;background:#fff}
.step button:hover{box-shadow:inset 0 0 0 1px var(--brand);color:var(--brand)}
.step button:disabled{opacity:.35;cursor:default}
.step b{min-width:1ch;text-align:center;font-weight:500}
.legs{display:grid;gap:6px;margin-top:10px}
.legs div{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:12px;background:#fff;box-shadow:inset 0 0 0 1px var(--hair);font-size:14px}
.legs .k{width:20px;height:20px;border-radius:50%;background:var(--brand-soft);color:var(--brand);font-size:11px;font-weight:600;display:grid;place-items:center}
.legs select{all:unset;cursor:pointer;font-weight:500;color:var(--brand)}
.primary{all:unset;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;border-radius:14px;background:linear-gradient(180deg,var(--brand-2),var(--brand));color:#fff;font-weight:500;box-shadow:0 1px 0 rgb(255 255 255/.25) inset,0 8px 20px rgb(62 111 216/.32);transition:transform .15s,box-shadow .25s,filter .15s}
.primary:hover{transform:translateY(-1px);box-shadow:0 1px 0 rgb(255 255 255/.25) inset,0 12px 26px rgb(62 111 216/.4)}
.primary:active{transform:translateY(0) scale(.98)}
.pop .primary{width:100%;margin-top:10px}

/* toolbar */
.tools{padding:2px 20px 0}
.trow{display:flex;align-items:center;gap:10px}
.qf{position:relative;flex:1;min-width:0;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:3px 24px 3px 2px;-webkit-mask:linear-gradient(90deg,#000 calc(100% - 28px),transparent);mask:linear-gradient(90deg,#000 calc(100% - 28px),transparent)}
.qf::-webkit-scrollbar{display:none}
.chip{all:unset;cursor:pointer;flex:none;display:inline-flex;align-items:center;gap:7px;padding:7px 13px 7px 11px;border-radius:999px;background:var(--glass-hi);box-shadow:inset 0 0 0 1px var(--hair),0 1px 2px rgb(16 24 64/.03);font-size:14px;color:var(--ink);transition:background .2s,box-shadow .2s,color .2s,transform .15s}
.chip .ic{color:var(--mut);width:15px;height:15px;transition:color .2s}
.chip .c{font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums;min-width:1.2em;text-align:right}
.chip:hover{background:#fff;box-shadow:inset 0 0 0 1px rgb(62 111 216/.35),0 2px 6px rgb(16 24 64/.06)}
.chip:active{transform:scale(.97)}
.chip[aria-pressed=true]{background:var(--brand-soft);box-shadow:inset 0 0 0 1.5px var(--brand);color:var(--brand);font-weight:500}
.chip[aria-pressed=true] .ic,.chip[aria-pressed=true] .c{color:var(--brand)}
.chip[aria-disabled=true]{opacity:.4;cursor:not-allowed}
.chip[aria-disabled=true]:hover{background:var(--glass-hi);box-shadow:inset 0 0 0 1px var(--hair)}
.fbtn{all:unset;cursor:pointer;flex:none;display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;background:#fff;box-shadow:inset 0 0 0 1.5px var(--brand);color:var(--brand);font-size:14px;font-weight:500;transition:background .2s}
.fbtn:hover{background:var(--brand-soft)}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--brand);color:#fff;font-size:11px;font-weight:600;display:grid;place-items:center;transition:transform .3s var(--e)}
.badge.bump{transform:scale(1.3)}
.pills{min-height:44px;display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px 0 6px}
.pill{display:inline-flex;align-items:center;gap:2px;padding:3px 3px 3px 11px;border-radius:999px;background:#fff;box-shadow:inset 0 0 0 1px var(--hair),0 1px 2px rgb(16 24 64/.04);font-size:13px;transition:opacity .25s,transform .3s var(--e)}
@starting-style{.pill{opacity:0;transform:scale(.92)}}
.pill button{all:unset;cursor:pointer;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:var(--mut)}
.pill button:hover{background:rgb(0 0 0/.06);color:var(--ink)}
.link{all:unset;cursor:pointer;font-size:13px;color:var(--brand);font-weight:500;padding:4px 6px;border-radius:8px}
.link:hover{background:var(--brand-soft)}
.meta{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 0 12px;font-size:13px;color:var(--mut)}
.meta b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.meta .pol-note{display:inline-flex;align-items:center;gap:5px;margin-left:10px;padding-left:10px;border-left:1px solid var(--hair)}
.sortw{position:relative;display:inline-flex;align-items:center;gap:6px}
.sortw select{appearance:none;-webkit-appearance:none;border:0;background:transparent;font:inherit;font-size:13px;font-weight:500;color:var(--ink);padding:4px 18px 4px 2px;cursor:pointer}
.sortw .ic{position:absolute;right:0;width:13px;height:13px;pointer-events:none;color:var(--mut)}

/* ticket */
.list{display:grid;gap:14px;padding:0 20px 28px}
.ticket{--n:11px;--pw:11.5rem;position:relative;display:grid;grid-template-columns:minmax(0,1fr) var(--pw);background:#fff;border-radius:22px;
  -webkit-mask:radial-gradient(circle var(--n) at calc(100% - var(--pw)) 0,#0000 98%,#000) top/100% 51% no-repeat,radial-gradient(circle var(--n) at calc(100% - var(--pw)) 100%,#0000 98%,#000) bottom/100% 51% no-repeat;
  mask:radial-gradient(circle var(--n) at calc(100% - var(--pw)) 0,#0000 98%,#000) top/100% 51% no-repeat,radial-gradient(circle var(--n) at calc(100% - var(--pw)) 100%,#0000 98%,#000) bottom/100% 51% no-repeat;
  filter:drop-shadow(0 1px 1px rgb(16 24 64/.05)) drop-shadow(0 10px 22px rgb(16 24 64/.06));transition:transform .35s var(--e),filter .35s var(--e)}
.ticket:hover,.ticket:focus-within{transform:translateY(-3px);filter:drop-shadow(0 2px 2px rgb(16 24 64/.06)) drop-shadow(0 20px 34px rgb(16 24 64/.12))}
.tm{padding:18px 22px 16px;min-width:0}
.th{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--mut);margin-bottom:14px}
.th .al{color:var(--ink);font-weight:500}
.th .fn{font-size:11px;letter-spacing:.08em;color:var(--faint)}
.tag{margin-left:auto;font-size:11px;font-weight:600;letter-spacing:.02em;padding:3px 9px;border-radius:999px}
.tag.cheap{background:var(--ok-soft);color:var(--ok)}.tag.fast{background:var(--brand-soft);color:var(--brand)}
.leg{display:grid;grid-template-columns:auto minmax(4rem,1fr) auto;gap:16px;align-items:center}
.leg+.leg{margin-top:14px;padding-top:14px;border-top:1px dashed var(--hair)}
.t{font-size:25px;font-weight:500;letter-spacing:-.025em;line-height:1;font-variant-numeric:tabular-nums}
.t sup{font-size:11px;color:var(--bad);font-weight:600;margin-left:2px;letter-spacing:0}
.apt{font-size:12px;letter-spacing:.08em;color:var(--mut);margin-top:5px}
.rt{text-align:center}
.rt .d{font-size:12px;color:var(--mut)}
.line{position:relative;height:18px;margin:2px 0}
.line::before{content:"";position:absolute;left:5px;right:5px;top:50%;border-top:1.5px dotted rgb(0 0 0/.18)}
.line i{position:absolute;top:50%;width:7px;height:7px;margin-top:-3.5px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 1.5px rgb(0 0 0/.25)}

  const via=stops?['FRA','MUC','ZRH','VIE'][Math.floor(r(9)*4)]:null;
  const legs=[{from:S.from,to:S.to,dep,dur,stops,via,lay:stops?(r(10)<.3?65:110):0,no:a.code+' '+(1000+Math.floor(r(11)*8999))}];
  if(S.trip==='multi')legs.push({from:S.to,to:S.leg2,dep:(dep+540+Math.floor(r(12)*24)*5)%1440,dur:85+Math.floor(r(13)*6)*5,stops:0,no:a.code+' '+(1000+Math.floor(r(14)*8999))});
  if(S.trip==='return')legs.push({from:S.to,to:S.from,dep:8*60+Math.floor(r(15)*130)*5,dur,stops:0,no:a.code+' '+(1000+Math.floor(r(16)*8999))});
  const refund=r(5)>.6,change=r(6)>.66?'free':r(6)>.3?'fee':'no',bags=r(7)>.5?1:0;
  const base=Math.round(70+r(8)*260+(refund?60:0)-(stops?25:0));
  out.push({id:i,a,legs,refund,change,bags,price:Math.round(base*(S.trip==='oneway'?1:1.7))});}
 return out}
let FL=gen();
/* fare rules: every combination maps to parts and to one sentence */
const parts=f=>[f.refund?{t:'Refundable',i:'back',g:1}:{t:'Non-refundable',i:'x'},
 {free:{t:'Free changes',i:'swap',g:1},fee:{t:'Changes for a fee',i:'swap'},no:{t:'No changes',i:'x'}}[f.change],
 f.bags?{t:'1 checked bag',i:'bag',g:1}:{t:'Cabin bag only',i:'bag'}];
const sentence=f=>`${f.refund?'You can cancel for a refund':'No refund if you cancel'}. ${{free:'You can change the date for free',fee:'You can change the date for a fee',no:'You can’t change the date'}[f.change]}. ${f.bags?'Includes one checked bag and a cabin bag':'Includes a cabin bag only'}.`;
const hhmm=m=>String(Math.floor(m/60)%24).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const dur=m=>Math.floor(m/60)+'h'+(m%60?' '+String(m%60).padStart(2,'0')+'m':'');
/* filters */
const OPTS={
 stops:[['direct','Direct only',f=>f.legs.every(l=>!l.stops)],['one','1 stop at most',f=>f.legs.every(l=>l.stops<=1)]],
 policy:[['in','In policy',f=>f.price/S.pax<=POLICY]],
 time:[['morning','Morning',f=>f.legs[0].dep<720],['afternoon','Afternoon',f=>f.legs[0].dep>=720&&f.legs[0].dep<1080],['evening','Evening',f=>f.legs[0].dep>=1080]],
 fare:[['refund','Refundable',f=>f.refund],['changes','Free changes',f=>f.change==='free'],['bag','Checked bag',f=>f.bags]],
 air:AIR.map(a=>[a.id,a.name,f=>f.a.id===a.id])};
const GROUPS=[['stops','Stops'],['policy','Company policy'],['time','Departure time'],['fare','Fare'],['air','Airlines']];
const QUICK=[['stops','direct','Direct only','arrow'],['policy','in','In policy','shield'],['time','morning','Morning','sun'],['fare','refund','Refundable','back']];
const TIMEHINT={morning:'before 12:00',afternoon:'12:00 to 18:00',evening:'after 18:00'};
const lab=(g,k)=>OPTS[g].find(o=>o[0]===k)[1];
const pass=(f,skip)=>{for(const g in S.f){if(g===skip||!S.f[g].size)continue;if(![...S.f[g]].some(k=>OPTS[g].find(o=>o[0]===k)[2](f)))return false}return true};
const results=()=>FL.filter(f=>pass(f));
const facet=(g,k)=>{const fn=OPTS[g].find(o=>o[0]===k)[2];return FL.filter(f=>pass(f,g)&&fn(f)).length};
/* build chips once, update in place */
const chipEl=(g,k,txt,icon,sub)=>`<button class="chip" data-g="${g}" data-k="${k}" aria-pressed="false">${icon?ic(icon):g==='air'?mark(AIR.find(a=>a.id===k),16):''}<span>${txt}${sub?` <span style="color:var(--faint)">${sub}</span>`:''}</span><span class="c"></span></button>`;
$('#qf').innerHTML=QUICK.map(([g,k,t,i])=>chipEl(g,k,t,i)).join('');
$('#dbody').innerHTML=GROUPS.map(([g,t])=>`<div class="grp" role="group" aria-label="${t}"><h4>${t}</h4><div class="chips">${OPTS[g].map(o=>chipEl(g,o[0],o[1],null,g==='time'?TIMEHINT[o[0]]:'')).join('')}</div>${g==='air'?'<p class="note2">Greyed out means none in these results. We list only what the airlines sent back.</p>':''}</div>`).join('');
function syncChips(){$$('.chip[data-g]').forEach(c=>{const g=c.dataset.g,k=c.dataset.k,on=S.f[g].has(k),n=facet(g,k);
  c.setAttribute('aria-pressed',on);$('.c',c).textContent=n;
  if(!on&&n===0){c.setAttribute('aria-disabled','true');c.title='None in these results'}else{c.removeAttribute('aria-disabled');c.removeAttribute('title')}})}
function renderPills(){const act=[];for(const g in S.f)S.f[g].forEach(k=>act.push([g,k]));
 const b=$('#badge'),old=b.textContent;b.textContent=act.length;b.hidden=!act.length;
 if(old!==String(act.length)&&act.length){b.classList.remove('bump');void b.offsetWidth;b.classList.add('bump');setTimeout(()=>b.classList.remove('bump'),220)}
 const qk=new Set(QUICK.map(q=>q[0]+'|'+q[1]));const extra=act.filter(([g,k])=>!qk.has(g+'|'+k));$('#pills').innerHTML=extra.map(([g,k])=>`<span class="pill">${lab(g,k)}<button data-g="${g}" data-k="${k}" aria-label="Remove ${lab(g,k)}">${ic('x')}</button></span>`).join('')+(act.length?'<button class="link" data-clear>Clear</button>':'')+'';
 $('#dsub').textContent=act.length?act.length+' selected':'Pick as many as you like';
 $('#dshow').textContent=`Show ${results().length} flights`}
function legHTML(l,out){const arr=l.dep+l.dur;
 return `<div class="leg"><div><div class="t">${hhmm(l.dep)}</div><div class="apt">${l.from}</div></div>
  <div class="rt"><div class="d">${dur(l.dur)}</div><div class="line"><i></i><i></i>${l.stops?'<span class="via"></span>':''}<svg class="pl" viewBox="0 0 24 24" aria-hidden="true">${I.plane}</svg></div><div class="s ${l.stops?'one':'dir'}">${l.stops?'1 stop, '+l.via:'Direct'}</div></div>
  <div style="text-align:right"><div class="t">${hhmm(arr)}${arr>=1440?'<sup>+1</sup>':''}</div><div class="apt">${l.to}</div></div></div>`}
function renderList(){let r=results();
 const key={best:f=>f.price*.6+f.legs[0].dur*.8+(f.legs[0].stops?80:0),price:f=>f.price,dep:f=>f.legs[0].dep,dur:f=>f.legs.reduce((s,l)=>s+l.dur,0)}[S.sort];
 r.sort((a,b)=>key(a)-key(b));
 const cheap=r.length?Math.min(...r.map(f=>f.price)):0,fast=r.length?Math.min(...r.map(f=>f.legs[0].dur)):0;
 $('#count').innerHTML=`<b>${r.length}</b> of ${FL.length} flights`;
 $('#list').innerHTML=r.length?r.map(f=>{const out=f.price/S.pax>POLICY,short=f.legs.find(l=>l.stops&&l.lay<90);
  const tag=f.price===cheap?'<span class="tag cheap">Cheapest</span>':f.legs[0].dur===fast?'<span class="tag fast">Fastest</span>':'';
  return `<article class="ticket" style="view-transition-name:t${f.id}" aria-label="${f.a.name}, departs ${hhmm(f.legs[0].dep)}, ${f.legs[0].from} to ${f.legs[0].to}, €${f.price}">
  <div class="tm"><div class="th">${mark(f.a)}<span class="al">${f.a.name}</span><span class="fn">${f.legs[0].no}</span>${tag}</div>
   ${f.legs.map(legHTML).join('')}
   ${short?`<div class="warn">${ic('warn')}Short connection in ${short.via}: ${short.lay} minutes.</div>`:''}
   <div class="tf">${parts(f).map(p=>`<span class="r ${p.g?'g':''}">${ic(p.g?'check':p.i)}${p.t}</span>`).join('')}
    <button class="more" aria-expanded="false" aria-controls="d${f.id}" aria-label="Flight details"><span>Details</span>${ic('chev')}</button></div>
   <div class="det" id="d${f.id}"><div class="det-in"><div><div class="k">Fare rules</div><div class="rule">${sentence(f)}</div></div>
    ${f.legs.map(l=>`<div class="sg"><span><b>${l.from} ${hhmm(l.dep)}</b> to <b>${l.to} ${hhmm(l.dep+l.dur)}</b>${l.stops?`, change in ${l.via} (${l.lay} min)`:''}</span><span>${l.no} · Economy</span></div>`).join('')}</div></div></div>
  <div class="tp"><div><div class="amt"><span>€</span>${f.price}</div><div class="pp">${S.pax>1?'total, '+S.pax+' travellers':'per traveller'}</div></div>
   <span class="pol ${out?'out':'in'}">${ic(out?'warn':'check')}${out?'Outside policy':'In policy'}</span>
   <button class="primary">Select</button></div></article>`}).join('')
 :`<div class="empty"><b>No flights match every filter</b>Remove one, or <button class="link" data-clear>clear them all</button>.</div>`}
function refresh(soft){const go=()=>{syncChips();renderPills();renderList()};
 if(soft&&document.startViewTransition&&!RM)document.startViewTransition(go);else go()}
function toggle(g,k){const s=S.f[g];s.has(k)?s.delete(k):s.add(k);refresh(true)}
/* search bar */
const P=c=>PORTS.find(p=>p[2]===c);
function renderBar(){const v=(f,h)=>$(`.sf[data-f=${f}] .v`).innerHTML=h;const d=DAYS[S.day];
 v('from',`${P(S.from)[0]}<small>${S.from}</small>`);v('to',`${P(S.to)[0]}<small>${S.to}</small>`);v('date',`${d[0]} ${d[1]} ${d[2]}`);
 v('who',`${{oneway:'One way',return:'Return',multi:'Multi-city'}[S.trip]}<span class="x2">, ${S.pax} ${S.pax>1?'adults':'adult'}</span>`);
 $('#mR').textContent=`${P(S.from)[0]} to ${P(S.to)[0]}${S.trip==='multi'?' and '+P(S.leg2)[0]:''}`;
 $('#mD').textContent=`${d[0]} ${d[1]} ${d[2]} · ${S.pax} ${S.pax>1?'adults':'adult'} · ${{oneway:'One way',return:'Return',multi:'Multi-city'}[S.trip]}`;
 const sw=$('#swap'),to=$('.sf[data-f=to]');sw.style.left=to.offsetLeft+'px'}
let openF=null;
function closePop(back){const f=openF;pop.hidden=true;openF=null;$$('.sf').forEach(b=>b.setAttribute('aria-expanded','false'));if(back&&f)$(`.sf[data-f=${f}]`).focus()}
function commit(){closePop();$('#sbar').classList.remove('open');$('#msum').setAttribute('aria-expanded','false');renderBar();
 $('#list').innerHTML='<div class="skel"></div><div class="skel"></div><div class="skel"></div>';
 setTimeout(()=>{FL=gen();refresh(true);const t=$('#toast');t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)},RM?0:420)}
function openPop(f){if(openF===f){closePop(true);return}closePop();openF=f;const btn=$(`.sf[data-f=${f}]`);btn.setAttribute('aria-expanded','true');
 const W=f==='date'?22*16:19*16;pop.style.width=W/16+'rem';pop.style.left=Math.max(0,Math.min(btn.offsetLeft,$('#sbar').offsetWidth-W))+'px';pop.hidden=false;
 if(f==='from'||f==='to'){
  pop.innerHTML=`<label class="field"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg><span class="sr">${f==='from'?'Leaving from':'Going to'}</span><input id="acIn" role="combobox" aria-expanded="true" aria-controls="acL" aria-autocomplete="list" placeholder="City or airport code" autocomplete="off"></label><ul class="ac" id="acL" role="listbox"></ul>`;
  const inp=$('#acIn'),ul=$('#acL');let idx=0,items=[];
  const draw=()=>{const q=inp.value.trim().toLowerCase();
   items=PORTS.filter(p=>p[2]!==(f==='from'?S.to:S.from)).filter(p=>!q||p[0].toLowerCase().includes(q)||p[2].toLowerCase().startsWith(q)||p[1].toLowerCase().includes(q));idx=Math.min(idx,Math.max(items.length-1,0));
   const hi=s=>{if(!q)return s;const i=s.toLowerCase().indexOf(q);return i<0?s:s.slice(0,i)+'<mark>'+s.slice(i,i+q.length)+'</mark>'+s.slice(i+q.length)};
   ul.innerHTML=items.length?items.map((p,i)=>`<li role="option" id="o${i}" aria-selected="${i===idx}" data-c="${p[2]}"><span class="pin">${ic('pin')}</span><span class="nm"><b>${hi(p[0])}</b><span>${hi(p[1])}</span></span><span class="code3">${hi(p[2])}</span></li>`).join(''):'<li class="none">No airport matches. Try the city name.</li>';
   inp.setAttribute('aria-activedescendant',items.length?'o'+idx:'');const sel=$('li[aria-selected=true]',ul);sel&&sel.scrollIntoView({block:'nearest'})};
  inp.oninput=()=>{idx=0;draw()};
  inp.onkeydown=e=>{if(e.key==='ArrowDown'){idx=Math.min(idx+1,items.length-1);draw();e.preventDefault()}else if(e.key==='ArrowUp'){idx=Math.max(idx-1,0);draw();e.preventDefault()}else if(e.key==='Enter'&&items[idx]){S[f]=items[idx][2];commit();e.preventDefault()}};
  ul.onmousemove=e=>{const li=e.target.closest('li[data-c]');if(li){const i=+li.id.slice(1);if(i!==idx){idx=i;$$('li',ul).forEach((x,j)=>x.setAttribute('aria-selected',j===idx))}}};
  ul.onclick=e=>{const li=e.target.closest('li[data-c]');if(li){S[f]=li.dataset.c;commit()}};
  draw();inp.focus({preventScroll:true});
 }else if(f==='date'){
  const pr=DAYS.map((d,i)=>Math.round(80+rnd(i*5+S.to.charCodeAt(0))*140)),min=Math.min(...pr);
  pop.innerHTML=`<div class="days" role="group" aria-label="Departure day. Lowest fare shown under each day.">${DAYS.map((d,i)=>`<button class="day" aria-pressed="${i===S.day}" data-d="${i}"><span>${d[0]}</span><b>${d[1]}</b><span class="p ${pr[i]===min?'low':''}">€${pr[i]}</span></button>`).join('')}</div><p class="hint">Lowest fare per day. Green is the cheapest this week.</p>`;
  pop.onclick=e=>{const b=e.target.closest('.day');if(b){S.day=+b.dataset.d;commit()}};$('.day[aria-pressed=true]',pop).focus({preventScroll:true});
 }else{
  pop.innerHTML=`<div class="seg2" role="group" aria-label="Trip type">${[['oneway','One way'],['return','Return'],['multi','Multi-city']].map(([k,t])=>`<button data-t="${k}" aria-pressed="${S.trip===k}">${t}</button>`).join('')}</div><div id="legs"></div>
   <div class="prow"><span>Adults<small>Business travellers</small></span><span class="step"><button id="m" aria-label="Fewer adults">−</button><b id="pn" aria-live="polite"></b><button id="pl" aria-label="More adults">+</button></span></div><button class="primary" id="done">Update search</button>`;
  const legs=()=>{$('#legs').innerHTML=S.trip==='multi'?`<div class="legs"><div><span class="k">1</span>${P(S.from)[0]} to ${P(S.to)[0]}</div><div><span class="k">2</span>${P(S.to)[0]} to&nbsp;<select id="l2" aria-label="Second flight to">${PORTS.filter(p=>p[2]!==S.to).map(p=>`<option value="${p[2]}" ${p[2]===S.leg2?'selected':''}>${p[0]}</option>`).join('')}</select></div></div>`:'';const l2=$('#l2');if(l2)l2.onchange=()=>S.leg2=l2.value};
  const sync=()=>{$('#pn').textContent=S.pax;$('#m').disabled=S.pax<=1;$('#pl').disabled=S.pax>=9};
  $$('.seg2 button',pop).forEach(b=>b.onclick=()=>{S.trip=b.dataset.t;$$('.seg2 button',pop).forEach(x=>x.setAttribute('aria-pressed',x===b));legs()});
  $('#m').onclick=()=>{S.pax--;sync()};$('#pl').onclick=()=>{S.pax++;sync()};$('#done').onclick=commit;legs();sync();
  $('.seg2 button[aria-pressed=true]',pop).focus({preventScroll:true})}
}
$$('.sf').forEach(b=>b.onclick=()=>openPop(b.dataset.f));
$('#swap').onclick=()=>{[S.from,S.to]=[S.to,S.from];commit()};
$('#msum').onclick=()=>{$('#sbar').classList.add('open');$('#msum').setAttribute('aria-expanded','true');$('.sf').focus()};

new ResizeObserver(renderBar).observe($('#sbar'));
/* clicks inside the product */
vp.addEventListener('click',e=>{
 const c=e.target.closest('.chip[data-g]');if(c){if(c.getAttribute('aria-disabled')==='true')return;toggle(c.dataset.g,c.dataset.k);return}

 if(e.target.closest('[data-clear],#dclear')){for(const g in S.f)S.f[g].clear();refresh(true);return}
 const m=e.target.closest('.more');if(m){const d=$('#'+m.getAttribute('aria-controls')),o=m.getAttribute('aria-expanded')!=='true';m.setAttribute('aria-expanded',o);d.classList.toggle('open',o);return}
});

$('#openF').onclick=()=>drawer.hidden?openDrawer():closeDrawer();$('#closeF').onclick=closeDrawer;$('#dshow').onclick=closeDrawer;

  if($('#vp').hidden)setV('refined');const t=$(`[data-a=${n.dataset.k}]`);if(!t)return;
