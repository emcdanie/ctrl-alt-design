<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 214" width="280" height="214" role="img" aria-label="An off-brand card an ungoverned agent produced: clashing magenta and lime colours, cramped spacing, tiny body text, and a call to action whose text fails contrast against its background.">
  <title>Ungoverned agent output</title>
  <defs>
    <linearGradient id="clash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="1" stop-color="#b6ff00"/>
    </linearGradient>
  </defs>

  <!-- the card: invented colours, a dashed lime border nothing specified -->
  <rect x="2" y="2" width="276" height="210" rx="12" fill="#ff2d9b"/>
  <rect x="3.5" y="3.5" width="273" height="207" rx="11" fill="none" stroke="#b6ff00" stroke-width="3" stroke-dasharray="7 5"/>

  <!-- a header image band in a gradient off the palette -->
  <rect x="2" y="2" width="276" height="70" rx="12" fill="url(#clash)"/>
  <rect x="2" y="52" width="276" height="20" fill="url(#clash)"/>

  <!-- the headline, drawn as bars: this is artwork, not text -->
  <rect x="18" y="88" width="150" height="15" rx="3" fill="#0b0b0b"/>

  <!-- body copy at a size no system would ship, drawn as hairlines -->
  <rect x="18" y="112" width="220" height="5" rx="2" fill="#2a2a2a"/>
  <rect x="18" y="122" width="196" height="5" rx="2" fill="#2a2a2a"/>
  <rect x="18" y="132" width="168" height="5" rx="2" fill="#2a2a2a"/>

  <!-- the call to action: lime on magenta, nowhere near a contrast bar -->
  <rect x="18" y="152" width="244" height="34" rx="3" fill="#b6ff00"/>
  <rect x="104" y="165" width="72" height="9" rx="2" fill="#ff2d9b"/>
</svg>
